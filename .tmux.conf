# ==========================================
# TERMINAL & INPUT SETTINGS
# ==========================================
set -g default-terminal "tmux-256color"
set-option -a terminal-overrides ",alacritty:RGB"
set-window-option -g xterm-keys on
set -s escape-time 0 
set-option -sg escape-time 0
set-option -g focus-events on
set-option -g history-limit 9000

# ==========================================
# DYNAMIC PREFIX SETTING
# ==========================================
# If hostname contains ".local", use Ctrl-a. Otherwise, use Ctrl-b.
# This also sets 'last-window' and 'send-prefix' for the active prefix.
if-shell "hostname | grep -q '.local'" \
   "set-option -g prefix C-a; bind-key C-a last-window; bind-key a send-prefix; unbind C-b" \
   "set-option -g prefix C-b; bind-key C-b last-window; bind-key b send-prefix; unbind C-a"

# Common navigation shortcuts
bind-key Space next-window
bind-key C-Space previous-window

# ==========================================
# STATUS BAR: LOCAL VS REMOTE LOGIC
# ==========================================
set-option -g status-interval 2
set-option -g status-justify centre
set-option -g status-left-length 60
set-option -g status-right-length 48

# Status bar background: Dim gray
set-option -g status-style bg=colour236,fg=colour7

# Left side: Detect if Local (.local) or Remote and display active Prefix
if-shell "hostname | grep -q '.local'" \
   'set -g status-left "#[bg=colour30,fg=white,bold] LOCAL:^A #[bg=default,fg=colour74,none] #S "' \
   'set -g status-left "#[bg=colour160,fg=white,bold] REMOTE:#H:^B #[bg=default,fg=colour74,none] #S "'

# Right side: Date and Time
set-option -g status-right-style bg=default,fg=colour74
set-option -g status-right "#(shortdate) %H:%M"

# Window Status styles
set-window-option -g window-status-style fg=colour244
set-window-option -g window-status-current-style fg=colour15,bg=colour30
set-window-option -g window-status-last-style fg=colour250
set-window-option -g window-status-bell-style fg='#000000',bg='#d78700',none

# ==========================================
# PANES & WINDOWS
# ==========================================
set-option -g base-index 1
set-option -g renumber-windows on

set-option -g pane-border-style fg=green,bg=black
set-option -g pane-active-border-style fg=colour74

# Creation and Splitting (maintaining path)
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

setw -g monitor-activity on
set -g visual-activity on

bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key b command-prompt -p "breaking-pane"  "break-pane"

# ==========================================
# COPY MODE & MISC
# ==========================================
setw -g mode-keys vi
set-option -g lock-command vlock
set-option -g set-titles on
set-option -g set-titles-string '[#S:#I #H] #W'
